<svg xmlns="http://www.w3.org/2000/svg" width="340" height="280" viewBox="0 0 340 280">
  <defs>
    <linearGradient id="hatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050302"/>
      <stop offset="1" stop-color="#1a100a"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8394"/>
      <stop offset="1" stop-color="#3a4052"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4526"/>
      <stop offset="1" stop-color="#4a2f1a"/>
    </linearGradient>
    <radialGradient id="lantern" cx="270" cy="96" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx="170" cy="250" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fe3b0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6fe3b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- the open hatch in the floor, and the dark going down -->
  <path d="M40 206 L300 206 L330 272 L10 272 Z" fill="#2a1a10"/>
  <path d="M56 214 L284 214 L308 266 L32 266 Z" fill="url(#hatch)"/>
  <path d="M56 214 L284 214 L308 266 L32 266 Z" fill="url(#depth)"/>
  <path d="M32 266 L56 214 L60 214 L38 266 Z" fill="#3a2718"/>
  <!-- the lifted trapdoor leaning back -->
  <path d="M60 206 L280 206 L262 168 L78 168 Z" fill="url(#plank)"/>
  <g stroke="#2a1a10" stroke-width="3"><line x1="120" y1="168" x2="112" y2="206"/><line x1="220" y1="168" x2="228" y2="206"/></g>
  <rect x="150" y="180" width="40" height="10" rx="3" fill="#3a4052"/>
  <!-- rails running into the hatch -->
  <g stroke="#8f9fb5" stroke-width="6" stroke-linecap="round">
    <line x1="100" y1="200" x2="80" y2="272"/><line x1="240" y1="200" x2="260" y2="272"/>
  </g>
  <!-- the cart -->
  <path d="M70 70 L270 70 L248 168 L92 168 Z" fill="url(#iron)"/>
  <path d="M70 70 L270 70 L264 88 L76 88 Z" fill="#9aa1b2"/>
  <g stroke="#2a2f3c" stroke-width="4"><line x1="120" y1="88" x2="126" y2="168"/><line x1="220" y1="88" x2="214" y2="168"/></g>
  <g fill="#2a2f3c">
    <circle cx="96" cy="104" r="4"/><circle cx="244" cy="104" r="4"/><circle cx="104" cy="152" r="4"/><circle cx="236" cy="152" r="4"/>
  </g>
  <!-- rock and a glint of stone heaped in it -->
  <path d="M84 72 Q100 36 140 44 Q170 22 206 40 Q246 36 258 72 Z" fill="#5a5f6e"/>
  <path d="M120 60 Q134 42 152 52 Q170 44 180 62" fill="none" stroke="#3a3f4c" stroke-width="3"/>
  <polygon points="150,44 160,30 170,44 160,56" fill="#63d8d0"/>
  <polygon points="200,54 208,44 216,54 208,62" fill="#e2564a"/>
  <circle cx="112" cy="58" r="6" fill="#e8b661"/>
  <!-- wheels -->
  <circle cx="118" cy="176" r="22" fill="#2a2f3c"/><circle cx="118" cy="176" r="10" fill="#8f9fb5"/>
  <circle cx="222" cy="176" r="22" fill="#2a2f3c"/><circle cx="222" cy="176" r="10" fill="#8f9fb5"/>
  <!-- a pickaxe resting against it -->
  <line x1="28" y1="200" x2="74" y2="74" stroke="#6b4526" stroke-width="9" stroke-linecap="round"/>
  <path d="M34 62 Q70 40 112 64 Q74 58 40 78 Z" fill="#b9c6d6"/>
  <!-- lantern on a hook -->
  <circle cx="270" cy="96" r="80" fill="url(#lantern)"/>
  <line x1="292" y1="10" x2="292" y2="58" stroke="#2a2f3c" stroke-width="4"/>
  <path d="M292 58 Q292 70 280 70" fill="none" stroke="#2a2f3c" stroke-width="3"/>
  <rect x="256" y="72" width="30" height="42" rx="6" fill="#2a2f3c"/>
  <rect x="261" y="78" width="20" height="30" rx="4" fill="#ffcf7a"/>
  <rect x="266" y="84" width="10" height="18" rx="3" fill="#fff1c2"/>
  <path d="M252 72 L290 72 L282 62 L260 62 Z" fill="#3a4052"/>
</svg>
