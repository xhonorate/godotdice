  <path d="M70 94 Q72 50 120 48 Q168 50 170 94 Q160 70 120 70 Q80 70 70 94 Z" fill="#7a7f8a"/>
  <path d="M64 70 Q70 30 120 28 Q172 30 178 70 Q120 58 64 70 Z" fill="#4a3122"/>
  <path d="M60 72 Q120 54 184 72 L186 80 Q120 64 58 80 Z" fill="#2a1a10"/>
