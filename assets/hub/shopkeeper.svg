  <path d="M74 118 Q74 196 120 206 Q166 196 166 118 Q150 150 120 150 Q90 150 74 118 Z" fill="#e7ecf4"/>
  <path d="M92 150 Q106 170 120 168 Q134 170 148 150" fill="none" stroke="#b6c1d2" stroke-width="3"/>
