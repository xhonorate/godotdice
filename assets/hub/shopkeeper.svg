    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f0c29a"/>
      <stop offset="1" stop-color="#c98f64"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="1" stop-color="#76b6ff"/>
    </radialGradient>
  </defs>
  <!-- shoulders and coat -->
  <path d="M34 300 Q30 200 70 176 Q120 156 170 176 Q210 200 206 300 Z" fill="url(#coat)"/>
  <path d="M86 186 L120 240 L154 186" fill="none" stroke="#1a2536" stroke-width="4"/>
  <path d="M78 300 L86 206 Q120 226 154 206 L162 300 Z" fill="url(#apron)"/>
  <rect x="98" y="244" width="44" height="30" rx="4" fill="#6b4526"/>
