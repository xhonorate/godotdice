  <!-- arms resting forward -->
  <path d="M40 300 Q36 236 64 214 L84 232 Q66 262 70 300 Z" fill="#2d4563"/>
  <path d="M200 300 Q204 236 176 214 L156 232 Q174 262 170 300 Z" fill="#2d4563"/>
