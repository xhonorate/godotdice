  <path d="M88 104 Q98 98 108 104" fill="none" stroke="#5a4a3a" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="98" cy="112" rx="5" ry="5.5" fill="#2a1a10"/>
  <circle cx="99.5" cy="110" r="1.6" fill="#fff"/>
  <circle cx="142" cy="112" r="17" fill="#c9963f"/>
  <circle cx="142" cy="112" r="13" fill="url(#lens)"/>
  <ellipse cx="142" cy="112" rx="7" ry="7.5" fill="#1a2b44"/>
  <circle cx="145" cy="108" r="3" fill="#fff" opacity="0.9"/>
  <path d="M158 116 Q172 124 170 140" fill="none" stroke="#8a6d3c" stroke-width="2"/>
  <path d="M130 94 Q142 88 154 94" fill="none" stroke="#5a4a3a" stroke-width="4" stroke-linecap="round"/>
