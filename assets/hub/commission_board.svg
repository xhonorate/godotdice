      <stop offset="0" stop-color="#7a4f2c"/>
      <stop offset="1" stop-color="#3f2715"/>
    </linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98652"/>
      <stop offset="1" stop-color="#8a5f37"/>
    </linearGradient>
  </defs>
  <rect x="10" y="12" width="280" height="250" rx="8" fill="#000" opacity="0.35"/>
  <rect x="8" y="8" width="280" height="250" rx="8" fill="url(#frame)"/>
  <rect x="24" y="24" width="248" height="218" rx="3" fill="url(#cork)"/>
