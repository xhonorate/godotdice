  <path d="M58 126 Q105 110 152 126 L148 214 Q128 262 105 270 Q82 262 62 214 Z" fill="url(#steel)"/>
  <path d="M105 118 L105 268" stroke="#4a5568" stroke-width="3" opacity="0.6"/>
  <path d="M66 150 Q105 140 144 150" fill="none" stroke="#4a5568" stroke-width="3" opacity="0.5"/>
  <path d="M70 196 Q105 186 140 196" fill="none" stroke="#4a5568" stroke-width="3" opacity="0.5"/>
  <path d="M72 138 Q84 132 94 134 L90 200 Q78 186 72 138 Z" fill="#ffffff" opacity="0.25"/>
  <!-- pauldrons -->
  <ellipse cx="50" cy="132" rx="26" ry="18" fill="url(#steel)"/>
  <ellipse cx="160" cy="132" rx="26" ry="18" fill="url(#steel)"/>
  <!-- a gem socketed in the chest: the loadout lives here -->
  <polygon points="105,170 120,186 105,208 90,186" fill="#e8b661"/>
  <polygon points="105,176 114,186 105,200 96,186" fill="#e2564a"/>
  <polygon points="103,180 107,184 104,190 100,185" fill="#ffc7bd"/>
  <!-- helm on the top of the pole -->
  <rect x="98" y="96" width="14" height="24" fill="url(#wood)"/>
  <path d="M66 70 Q66 16 105 14 Q144 16 144 70 L144 96 Q105 108 66 96 Z" fill="url(#steel)"/>
  <path d="M78 58 L132 58 L132 70 L78 70 Z" fill="#1a2030"/>
  <path d="M104 14 L104 96" stroke="#4a5568" stroke-width="3" opacity="0.5"/>
  <path d="M100 14 Q110 -6 130 4 Q116 6 110 20 Z" fill="#e2564a"/>
  <path d="M80 24 Q90 18 98 18 L94 56 Q82 46 80 24 Z" fill="#ffffff" opacity="0.28"/>
  <!-- a sword leaning on the stand -->
  <path d="M176 200 L190 190 L196 420 L184 422 Z" fill="url(#steel)"/>
  <rect x="164" y="184" width="44" height="10" rx="3" fill="#c9963f" transform="rotate(-8 186 189)"/>
  <rect x="180" y="150" width="10" height="38" rx="3" fill="#5a3a20" transform="rotate(-6 185 169)"/>
  <circle cx="182" cy="146" r="7" fill="#e8b661"/>
