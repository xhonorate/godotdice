<svg xmlns="http://www.w3.org/2000/svg" width="210" height="450" viewBox="0 0 210 450">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe7f2"/>
      <stop offset="0.5" stop-color="#8f9fb5"/>
      <stop offset="1" stop-color="#4a5568"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4f2c"/>
      <stop offset="1" stop-color="#4a2f1a"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2f2a"/>
      <stop offset="1" stop-color="#4a1618"/>
    </linearGradient>
  </defs>
  <ellipse cx="105" cy="436" rx="86" ry="12" fill="#000" opacity="0.45"/>
  <!-- base and pole -->
  <path d="M40 436 L170 436 L150 414 L60 414 Z" fill="url(#wood)"/>
  <rect x="96" y="250" width="18" height="170" fill="url(#wood)"/>
