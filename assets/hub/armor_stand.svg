  <path d="M46 120 Q30 250 44 360 Q70 344 88 366 Q105 340 122 366 Q140 344 166 360 Q180 250 164 120 Z" fill="url(#cloak)"/>
  <!-- cross bar -->
  <rect x="34" y="118" width="142" height="14" rx="6" fill="url(#wood)"/>
