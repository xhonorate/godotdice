<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15101b"/>
      <stop offset="0.7" stop-color="#2a1f2c"/>
      <stop offset="1" stop-color="#342531"/>
    </linearGradient>
    <linearGradient id="wainscot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3122"/>
      <stop offset="1" stop-color="#2c1c13"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2819"/>
      <stop offset="1" stop-color="#140c07"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1630"/>
      <stop offset="1" stop-color="#27406d"/>
    </linearGradient>
    <radialGradient id="lamp" cx="800" cy="150" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ff9d5c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff9d5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="560" cy="175" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfe0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bfe0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="800" cy="470" r="980" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b1f27"/>
      <stop offset="1" stop-color="#3a1218"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4526"/>
      <stop offset="1" stop-color="#3f2715"/>
    </linearGradient>
  </defs>

  <!-- back wall and its boards -->
  <rect width="1600" height="620" fill="url(#wall)"/>
  <g stroke="#0e0a12" stroke-width="3" opacity="0.55">
    <line x1="80" y1="0" x2="80" y2="470"/><line x1="200" y1="0" x2="200" y2="470"/>
    <line x1="330" y1="0" x2="330" y2="470"/><line x1="450" y1="0" x2="450" y2="470"/>
    <line x1="690" y1="0" x2="690" y2="470"/><line x1="820" y1="0" x2="820" y2="470"/>
    <line x1="940" y1="0" x2="940" y2="470"/><line x1="1080" y1="0" x2="1080" y2="470"/>
    <line x1="1210" y1="0" x2="1210" y2="470"/><line x1="1340" y1="0" x2="1340" y2="470"/>
    <line x1="1470" y1="0" x2="1470" y2="470"/>
  </g>
  <rect x="0" y="0" width="1600" height="26" fill="#0c080e"/>
  <rect x="0" y="22" width="1600" height="10" fill="#3a2718"/>

  <!-- wainscot -->
  <rect x="0" y="470" width="1600" height="150" fill="url(#wainscot)"/>
  <rect x="0" y="462" width="1600" height="14" fill="#6b4526"/>
  <rect x="0" y="474" width="1600" height="4" fill="#23160d"/>
  <g fill="none" stroke="#22150c" stroke-width="3" opacity="0.8">
    <rect x="24" y="498" width="150" height="96" rx="4"/><rect x="198" y="498" width="150" height="96" rx="4"/>
    <rect x="372" y="498" width="150" height="96" rx="4"/><rect x="1080" y="498" width="150" height="96" rx="4"/>
    <rect x="1254" y="498" width="150" height="96" rx="4"/><rect x="1428" y="498" width="150" height="96" rx="4"/>
  </g>

  <!-- the window, night outside -->
  <rect x="468" y="104" width="190" height="238" rx="6" fill="#2a1a10"/>
  <rect x="482" y="118" width="162" height="210" fill="url(#sky)"/>
  <circle cx="560" cy="175" r="120" fill="url(#moonglow)"/>
  <circle cx="584" cy="168" r="22" fill="#e9f3ff"/>
  <circle cx="576" cy="162" r="20" fill="#27406d" opacity="0.28"/>
  <g fill="#dfe9ff">
    <circle cx="510" cy="140" r="1.8"/><circle cx="626" cy="214" r="1.5"/><circle cx="520" cy="236" r="1.2"/>
    <circle cx="612" cy="132" r="1.4"/><circle cx="536" cy="198" r="1.1"/>
  </g>
  <path d="M482 300 L520 268 L548 286 L590 250 L626 278 L644 262 L644 328 L482 328 Z" fill="#0b1224"/>
  <rect x="558" y="118" width="10" height="210" fill="#2a1a10"/>
  <rect x="482" y="218" width="162" height="10" fill="#2a1a10"/>
  <rect x="460" y="336" width="206" height="16" rx="3" fill="#5a3a20"/>
  <path d="M482 118 L644 118 L620 328 L482 328 Z" fill="#9fc7ff" opacity="0.05"/>

  <!-- shelves of jars and boxes behind the counter -->
  <g>
    <rect x="936" y="150" width="14" height="330" fill="#3f2715"/>
    <rect x="1160" y="150" width="14" height="330" fill="#3f2715"/>
    <rect x="928" y="232" width="254" height="14" fill="url(#shelf)"/>
    <rect x="928" y="340" width="254" height="14" fill="url(#shelf)"/>
    <rect x="928" y="448" width="254" height="14" fill="url(#shelf)"/>
    <rect x="962" y="186" width="30" height="46" rx="5" fill="#63d8d0" opacity="0.55"/>
    <rect x="966" y="178" width="22" height="10" fill="#8a6d3c"/>
    <rect x="1002" y="196" width="46" height="36" rx="3" fill="#7a2f2a"/>
    <rect x="1002" y="206" width="46" height="4" fill="#e8b661"/>
    <circle cx="1080" cy="214" r="18" fill="#b98bff" opacity="0.6"/>
    <rect x="1072" y="190" width="16" height="8" fill="#8a6d3c"/>
    <rect x="1108" y="176" width="40" height="56" rx="4" fill="#2d5687"/>
    <rect x="1114" y="186" width="28" height="12" fill="#d8c7a4"/>
    <rect x="958" y="296" width="60" height="44" rx="3" fill="#5a3a20"/>
    <rect x="958" y="306" width="60" height="4" fill="#c9963f"/>
    <rect x="1030" y="286" width="26" height="54" rx="10" fill="#6fe3b0" opacity="0.5"/>
    <rect x="1034" y="278" width="18" height="10" fill="#8a6d3c"/>
    <rect x="1070" y="300" width="36" height="40" rx="3" fill="#3a4658"/>
    <circle cx="1136" cy="320" r="18" fill="#ff7a6b" opacity="0.55"/>
    <rect x="1128" y="296" width="16" height="8" fill="#8a6d3c"/>
    <rect x="962" y="402" width="44" height="46" rx="4" fill="#8a5a2e"/>
    <rect x="1016" y="410" width="54" height="38" rx="3" fill="#2a3346"/>
    <rect x="1022" y="420" width="42" height="4" fill="#b9c6d6"/>
    <rect x="1086" y="394" width="28" height="54" rx="10" fill="#ffcf7a" opacity="0.5"/>
    <rect x="1124" y="416" width="32" height="32" rx="3" fill="#4a3122"/>
  </g>

  <!-- floor -->
  <rect x="0" y="610" width="1600" height="290" fill="url(#floor)"/>
  <g stroke="#1a100a" stroke-width="3" opacity="0.7">
    <line x1="800" y1="610" x2="-400" y2="900"/><line x1="800" y1="610" x2="0" y2="900"/>
    <line x1="800" y1="610" x2="330" y2="900"/><line x1="800" y1="610" x2="640" y2="900"/>
    <line x1="800" y1="610" x2="960" y2="900"/><line x1="800" y1="610" x2="1270" y2="900"/>
    <line x1="800" y1="610" x2="1600" y2="900"/><line x1="800" y1="610" x2="2000" y2="900"/>
  </g>
  <g stroke="#1a100a" stroke-width="2" opacity="0.45">
    <line x1="0" y1="660" x2="1600" y2="660"/><line x1="0" y1="730" x2="1600" y2="730"/>
    <line x1="0" y1="815" x2="1600" y2="815"/>
  </g>
  <rect x="0" y="606" width="1600" height="8" fill="#1a100a"/>

  <!-- rug -->
  <path d="M520 700 L1080 700 L1180 880 L420 880 Z" fill="url(#rug)"/>
  <path d="M548 716 L1052 716 L1140 864 L460 864 Z" fill="none" stroke="#e8b661" stroke-width="4" opacity="0.55"/>
  <path d="M580 734 L1020 734 L1096 848 L504 848 Z" fill="none" stroke="#c9963f" stroke-width="2" stroke-dasharray="10 8" opacity="0.5"/>
  <circle cx="800" cy="790" r="34" fill="none" stroke="#e8b661" stroke-width="3" opacity="0.4"/>

  <!-- hanging lamp -->
  <line x1="800" y1="30" x2="800" y2="92" stroke="#1a120c" stroke-width="4"/>
  <path d="M760 92 L840 92 L866 132 L734 132 Z" fill="#6b4526"/>
  <ellipse cx="800" cy="134" rx="66" ry="10" fill="#ffcf7a"/>
  <ellipse cx="800" cy="134" rx="40" ry="6" fill="#fff1c2"/>
  <rect width="1600" height="900" fill="url(#lamp)"/>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
