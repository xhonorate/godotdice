<svg xmlns="http://www.w3.org/2000/svg" width="250" height="220" viewBox="0 0 250 220">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d6a8"/>
      <stop offset="1" stop-color="#c7a86e"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6d3c"/>
      <stop offset="1" stop-color="#4a3122"/>
    </linearGradient>
  </defs>
  <rect x="12" y="14" width="230" height="196" rx="6" fill="#000" opacity="0.35"/>
  <rect x="8" y="8" width="230" height="196" rx="6" fill="url(#frame)"/>
  <rect x="20" y="20" width="206" height="172" fill="url(#parchment)"/>
  <path d="M20 20 L226 20 L226 40 Q180 30 140 44 Q90 54 20 36 Z" fill="#b8955a" opacity="0.25"/>
  <!-- contour lines -->
  <g fill="none" stroke="#9c7b48" stroke-width="1.5" opacity="0.6">
    <path d="M36 150 Q70 120 110 140 T190 120"/>
    <path d="M40 168 Q84 140 128 158 T214 140"/>
    <path d="M60 70 Q90 52 120 70 T176 60"/>
  </g>
  <!-- routes between mines -->
  <g fill="none" stroke="#6b4526" stroke-width="3" stroke-dasharray="7 5">
    <path d="M124 128 L72 76"/><path d="M124 128 L180 80"/>
  </g>
  <!-- the quarry, lit -->
  <circle cx="124" cy="130" r="15" fill="#c9a26b" stroke="#3a2718" stroke-width="3"/>
  <path d="M116 136 L124 120 L132 136 Z" fill="#3a2718"/>
  <!-- two mines still in shadow -->
  <circle cx="70" cy="74" r="12" fill="#6b5a44" stroke="#3a2718" stroke-width="3"/>
  <path d="M66 70 Q66 65 70 65 Q75 65 75 70 Q75 73 70 75 L70 78" fill="none" stroke="#e9d6a8" stroke-width="2.5" stroke-linecap="round"/><circle cx="70" cy="82" r="1.6" fill="#e9d6a8"/>
  <circle cx="182" cy="78" r="12" fill="#6b5a44" stroke="#3a2718" stroke-width="3"/>
  <path d="M178 74 Q178 69 182 69 Q187 69 187 74 Q187 77 182 79 L182 82" fill="none" stroke="#e9d6a8" stroke-width="2.5" stroke-linecap="round"/><circle cx="182" cy="86" r="1.6" fill="#e9d6a8"/>
  <!-- compass -->
  <g transform="translate(200 164)">
    <circle r="14" fill="none" stroke="#6b4526" stroke-width="2"/>
    <polygon points="0,-12 4,0 0,12 -4,0" fill="#7a2f2a"/>
    <polygon points="-12,0 0,4 12,0 0,-4" fill="#6b4526"/>
  </g>
  <!-- pins -->
  <circle cx="30" cy="30" r="5" fill="#e2564a"/><circle cx="216" cy="30" r="5" fill="#e2564a"/>
</svg>
